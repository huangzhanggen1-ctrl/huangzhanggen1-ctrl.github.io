name: One-shot mobile chart UI patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-mobile-chart-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch mobile chart UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'MOBILE_CHART_UI_231_PATCH'
          if marker not in s:
              css = r'''
<style id="mobile-chart-ui-231-patch">
/* MOBILE_CHART_UI_231_PATCH: visual-only mobile ergonomics; no indicator/model logic */
@media (max-width:760px){
  .chartFrame .tip,
  #macau-special-panel .smp-tip{
    top:6px!important;
    left:6px!important;
    max-width:calc(100% - 12px)!important;
    padding:5px 7px!important;
    gap:3px 6px!important;
    border-radius:7px!important;
    font-size:9px!important;
    line-height:1.28!important;
    box-shadow:0 4px 12px #0006!important;
  }
  .chartFrame .tip b,
  #macau-special-panel .smp-tip b{
    font-size:10px!important;
    line-height:1.25!important;
  }
  .chartFrame .tip span,
  #macau-special-panel .smp-tip span{
    font-size:9px!important;
    line-height:1.25!important;
  }
  .chartPanel,
  #macau-special-panel .smp-chart-panel{
    padding-bottom:calc(104px + env(safe-area-inset-bottom))!important;
  }
  .chartPointNav,
  #macau-special-panel .smp-point-nav{
    position:relative;
    z-index:4;
    margin-bottom:12px!important;
  }
  .chartBelowControls,
  #macau-special-panel .smp-chart-below-controls{
    scroll-margin-bottom:calc(110px + env(safe-area-inset-bottom));
  }
}
@media (max-width:390px){
  .chartFrame .tip,
  #macau-special-panel .smp-tip{
    font-size:8.5px!important;
    gap:2px 5px!important;
  }
}
</style>
'''
              s = s.replace('</body>', css + '\n</body>', 1)
          s = s.replace("#91a8c1ad", "#b8cbe0d9")
          s = s.replace('"#91a8c1ad"', '"#b8cbe0d9"')
          p.write_text(s, encoding='utf-8')
      - name: Verify patch is visual only
        shell: bash
        run: |
          grep -q 'MOBILE_CHART_UI_231_PATCH' index.html
          grep -q '#b8cbe0d9' index.html
          grep -q '2026-231' index.html
          grep -q 'KDJ(9,3,3)' index.html
      - name: Commit patched page and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-mobile-chart-ui.yml
          git config user.name 'chatgpt-web-patch'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/one-shot-mobile-chart-ui.yml
          git commit -m 'Improve mobile chart lock card and bottom controls'
          git push origin HEAD:main

# trigger: 2026-08-21-mobile-ui
