name: Build Windows Special Column

on:
  push:
    branches: [main]
    paths:
      - 'special-desktop.html'
      - 'latest.html'
      - 'bootstrap-data.js'
      - '_includes/base231.html'
      - 'desktop/shell-fixes.js'
      - 'desktop-special/**'
      - '.github/workflows/build-windows-special.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify all classification partitions
        run: node desktop-special/verify-classification-spec.js

      - name: Build shared classification runtime
        run: node desktop-special/build-classification-runtime.js

      - name: Build and verify standalone special snapshot
        run: node desktop-special/build-snapshot-v2.js

      - name: Prepare persistent latest shell
        shell: pwsh
        run: |
          $stamp = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          Invoke-WebRequest -UseBasicParsing -Uri "https://huangzhanggen1-ctrl.github.io/latest.html?v=special-$stamp" -OutFile "desktop-special/app/latest.html"
          Copy-Item "desktop/shell-fixes.js" "desktop-special/app/shell-fixes.js" -Force
          Copy-Item "desktop-special/membership-button.js" "desktop-special/app/membership-button.js" -Force
          $latest = Get-Content "desktop-special/app/latest.html" -Raw
          $latest = [regex]::Replace($latest, 'src="\./\?v=[^"]*"', 'src="./index.html"', 1)
          $latest = $latest -replace '</body>', '<script src="./shell-fixes.js"></script><script src="./membership-button.js"></script></body>'
          Set-Content -Path "desktop-special/app/latest.html" -Value $latest -Encoding UTF8
          if ((Get-Content "desktop-special/app/latest.html" -Raw) -notmatch 'src="./index.html"') { throw 'Special shell iframe target was not fixed.' }
          if ((Get-Content "desktop-special/app/latest.html" -Raw) -notmatch 'shell-fixes.js') { throw 'Special shell fixes were not injected.' }
          if ((Get-Content "desktop-special/app/latest.html" -Raw) -notmatch 'membership-button.js') { throw 'Membership button was not injected.' }

      - name: Install desktop dependencies
        working-directory: desktop-special
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        working-directory: desktop-special
        run: npm run dist:win

      - name: Split installer for reliable handoff
        shell: pwsh
        run: |
          $exe = Get-ChildItem "desktop-special/release/*.exe" | Select-Object -First 1
          if (-not $exe) { throw 'Installer not found for split.' }
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          $cut = [Math]::Ceiling($bytes.Length / 2)
          [System.IO.File]::WriteAllBytes("desktop-special/release/member-installer.part1", $bytes[0..($cut-1)])
          [System.IO.File]::WriteAllBytes("desktop-special/release/member-installer.part2", $bytes[$cut..($bytes.Length-1)])
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          Set-Content "desktop-special/release/member-installer.sha256.txt" "$sha  $($exe.Name)" -Encoding ASCII
          Write-Host "Installer bytes: $($bytes.Length)"
          Write-Host "SHA256: $sha"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: XinMacau-Special-Kline-V7.0-Windows-Installer
          path: desktop-special/release/*.exe
          if-no-files-found: error
          retention-days: 90

      - name: Upload installer part 1
        uses: actions/upload-artifact@v4
        with:
          name: XinMacau-Special-Kline-V7.0-Member-Part1
          path: desktop-special/release/member-installer.part1
          if-no-files-found: error
          retention-days: 90

      - name: Upload installer part 2
        uses: actions/upload-artifact@v4
        with:
          name: XinMacau-Special-Kline-V7.0-Member-Part2
          path: desktop-special/release/member-installer.part2
          if-no-files-found: error
          retention-days: 90

      - name: Upload installer checksum
        uses: actions/upload-artifact@v4
        with:
          name: XinMacau-Special-Kline-V7.0-Member-SHA256
          path: desktop-special/release/member-installer.sha256.txt
          if-no-files-found: error
          retention-days: 90
