name: Build Windows Special Column

on:
  push:
    branches: [main]
    paths:
      - 'special-desktop.html'
      - 'bootstrap-data.js'
      - '_includes/base231.html'
      - 'desktop-special/**'
      - '.github/workflows/build-windows-special.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and verify standalone special snapshot
        run: node desktop-special/build-snapshot.js

      - name: Install desktop dependencies
        working-directory: desktop-special
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        working-directory: desktop-special
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: XinMacau-Special-Kline-V7.0-Windows-Installer
          path: desktop-special/release/*.exe
          if-no-files-found: error
          retention-days: 90
