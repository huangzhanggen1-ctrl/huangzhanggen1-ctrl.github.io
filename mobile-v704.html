special += "<style id=\"smp-expert-disclosure-style\">\n#macau-special-panel #smp-expert-disclosure{margin:10px 0;min-width:0;border:1px solid #304c67;border-radius:12px;background:#0b1b2d;overflow:hidden}\n#macau-special-panel .smp-expert-disclosure-head{display:flex;align-items:center;gap:12px;min-width:0;padding:7px 10px}\n#macau-special-panel .smp-expert-disclosure-title{flex:1;min-width:0;color:#bfd7ec;font-size:13px;line-height:1.5}\n#macau-special-panel #smp-expert-disclosure-toggle{flex:none;min-width:72px;min-height:34px;padding:6px 12px;border:1px solid #4aaddb;border-radius:8px;background:#124765;color:#e2f7ff;font-size:13px;font-weight:700;line-height:1.4;cursor:pointer;touch-action:manipulation}\n#macau-special-panel #smp-expert-disclosure-toggle:hover{background:#195a7b}\n#macau-special-panel #smp-expert-disclosure-toggle:focus-visible,#macau-special-panel #smp-expert-disclosure-summary:focus-visible{outline:2px solid #7bdcff;outline-offset:2px}\n#macau-special-panel #smp-expert-disclosure-summary{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;color:#c9e2f4;font-size:13px;line-height:1.8;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}\n#macau-special-panel #smp-expert-disclosure-details{padding:0 8px 8px}\n#macau-special-panel #smp-expert-disclosure [hidden]{display:none!important}\n@media(max-width:760px),(pointer:coarse){\n  #macau-special-panel .smp-expert-disclosure-head{gap:8px;padding:6px 8px}\n  #macau-special-panel #smp-expert-disclosure-toggle{min-width:76px;min-height:44px;font-size:14px;padding:10px 12px}\n  #macau-special-panel .smp-expert-disclosure-title,#macau-special-panel #smp-expert-disclosure-summary{font-size:14px}\n  #macau-special-panel #smp-expert-disclosure-details{padding:0 6px 6px}\n}\n</style>\n<script id=\"smp-expert-disclosure-script\">\n(function () {\n  'use strict';\n  function install() {\n    var panel = document.getElementById('macau-special-panel');\n    if (!panel || panel.querySelector('#smp-expert-disclosure')) return;\n    var ids = ['smp-expert-card', 'smp-shadow-s2-card', 'smp-shadow-s3-card', 'smp-shadow-s4-card'];\n    var statusIds = ['smp-expert-status', 'smp-shadow-s2-status', 'smp-shadow-s3-status', 'smp-shadow-s4-status'];\n    var cards = ids.map(function (id) { return panel.querySelector('#' + id); });\n    var statuses = statusIds.map(function (id) { return panel.querySelector('#' + id); });\n    if (cards.some(function (card) { return !card; }) || statuses.some(function (status) { return !status; })) return;\n    var parent = cards[0].parentNode;\n    if (cards.some(function (card) { return card.parentNode !== parent; })) return;\n    // Wrap only the four existing cards. Their nodes, renderers and calculations stay alive.\n    var group = document.createElement('section');\n    group.id = 'smp-expert-disclosure';\n    group.setAttribute('aria-label', '正式专家提示 / S2 / S3 / S4');\n    group.innerHTML = '<div class=\"smp-expert-disclosure-head\">' +\n      '<b class=\"smp-expert-disclosure-title\">专家提示 / S2 / S3 / S4</b>' +\n      '<div id=\"smp-expert-disclosure-summary\" role=\"status\" aria-live=\"polite\" aria-atomic=\"true\" tabindex=\"0\" hidden></div>' +\n      '<button type=\"button\" id=\"smp-expert-disclosure-toggle\" aria-expanded=\"true\" aria-controls=\"smp-expert-disclosure-details\" aria-label=\"收起正式专家提示、S2、S3、S4详情\">收起 ▴</button></div>' +\n      '<div id=\"smp-expert-disclosure-details\"></div>';\n    parent.insertBefore(group, cards[0]);\n    var details = group.querySelector('#smp-expert-disclosure-details');\n    cards.forEach(function (card) { details.appendChild(card); });\n    var title = group.querySelector('.smp-expert-disclosure-title');\n    var summary = group.querySelector('#smp-expert-disclosure-summary');\n    var button = group.querySelector('#smp-expert-disclosure-toggle');\n    var labels = ['正式专家', 'S2', 'S3', 'S4'];\n    function syncSummary() {\n      var text = statuses.map(function (status, index) {\n        var value = status.textContent.replace(/\\s+/g, ' ').replace(/^[○◯▲▼■◇◆◎●]\\s*/, '').trim();\n        if (index) value = value.replace(new RegExp('^' + labels[index] + '\\\\s*'), '');\n        return labels[index] + '：' + (value || '等待更新');\n      }).join(' ｜ ');\n      if (summary.textContent !== text) {\n        summary.textContent = text;\n        summary.title = text;\n      }\n    }\n    // Observe the actual rendered statuses, including asynchronous S3/S4 updates.\n    // No polling, state writes, render calls, chart events or ledger calls are needed.\n    var observer = new MutationObserver(syncSummary);\n    statuses.forEach(function (status) {\n      observer.observe(status, { childList: true, characterData: true, subtree: true });\n    });\n    syncSummary();\n    button.addEventListener('click', function () {\n      var expanded = button.getAttribute('aria-expanded') !== 'true';\n      syncSummary();\n      details.hidden = !expanded;\n      title.hidden = !expanded;\n      summary.hidden = expanded;\n      button.setAttribute('aria-expanded', String(expanded));\n      button.setAttribute('aria-label', (expanded ? '收起' : '展开') + '正式专家提示、S2、S3、S4详情');\n      button.textContent = expanded ? '收起 ▴' : '展开 ▾';\n    });\n  }\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', install, { once: true });\n  else install();\n})();\n<\/script>\n";
