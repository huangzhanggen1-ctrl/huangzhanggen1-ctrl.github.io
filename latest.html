<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071728"><title>新澳门K线 · 最新运行版</title><style>:root{--bg:#071728;--text:#eef5ff;--muted:#91a8c1}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}.shell{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr}.latest{z-index:5;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid #24405d;background:linear-gradient(180deg,#102b47,#0a1a2d)}.latestHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.latestHead h1{margin:0;font-size:17px}.latestHead small{color:var(--muted);font-size:10px}.update{min-height:40px;padding:8px 12px;border:1px solid #4aaddb;border-radius:10px;background:#176b96;color:#fff;font-weight:900}.balls{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:9px}.ball{padding:6px 2px;border:1px solid #31506e;border-radius:10px;background:#0a1c30;text-align:center}.ball strong{display:block;font-size:18px}.ball span{display:block;margin-top:4px;color:#bfd0e2;font-size:10px}.ball.special{border-color:#8d7331;background:#2a2411}.ball.special strong,.ball.special span{color:#ffe28a}.meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:8px;color:#9fb2c7;font-size:10px}.badge{padding:3px 7px;border:1px solid #2a634d;border-radius:999px;background:#0d382b;color:#9be2bf;font-weight:800}.badge.local{border-color:#8d7331;background:#3a3218;color:#ffe28a}.app{width:100%;height:100%;border:0;background:var(--bg)}.backdrop{position:fixed;inset:0;z-index:40;display:grid;place-items:end center;padding:12px;background:#0009}.backdrop[hidden]{display:none!important}.sheet{width:min(620px,100%);max-height:88dvh;overflow:auto;padding:16px 14px calc(16px + env(safe-area-inset-bottom));border:1px solid #2c4462;border-radius:18px;background:#0b1b2d}.sheetHead{display:flex;justify-content:space-between;align-items:center}.sheetHead h2{margin:0;font-size:18px}.close{position:relative;z-index:100;min-width:56px;min-height:56px;border:1px solid #405975;border-radius:14px;background:#13263e;color:#dce8f6;font-size:28px;line-height:1;touch-action:manipulation;pointer-events:auto;-webkit-tap-highlight-color:transparent}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.field{display:grid;gap:5px;color:#a8bad0;font-size:12px}.field input,.nums input{border:1px solid #2d4664;border-radius:9px;background:#071522;color:#fff;font-weight:800}.field input{min-height:44px;padding:8px 10px;font-size:16px}.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.nums label{display:grid;gap:4px;color:#8199b4;font-size:10px}.nums input{width:100%;min-width:0;min-height:52px;text-align:center;font-size:21px}.nums label:last-child{grid-column:span 2}.preview{margin-top:12px;padding:10px;border:1px solid #29415b;border-radius:10px;background:#081725;color:#9db1c8;font-size:12px}.preview.ok{border-color:#246449;color:#9be2bf}.preview.error{border-color:#8e3d43;color:#ffaaa8}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.actions button{min-height:48px;border:1px solid #2f4c6a;border-radius:10px;background:#13263e;color:#dce8f6;font-weight:900}.actions .save{background:#176b52}.actions .danger{background:#4b2025}.note{margin-top:10px;color:#91a8c1;font-size:11px;line-height:1.55}</style></head><body><div class="shell"><section class="latest"><div class="latestHead"><div><h1>最新开奖结果查询</h1><small id="subtitle"></small></div><button id="update" class="update" type="button">更新开奖</button></div><div id="balls" class="balls"></div><div id="meta" class="meta"></div></section><iframe id="app" class="app" title="新澳门生肖尾数K线" src="./mobile-v704.html?v=20260904-zoom-v2"></iframe></div><div id="backdrop" class="backdrop" hidden><section class="sheet"><div class="sheetHead"><h2>录入最新开奖</h2><button id="close" class="close" type="button" aria-label="关闭" onclick="document.getElementById('backdrop').hidden=true;return false;" ontouchend="document.getElementById('backdrop').hidden=true;event.preventDefault();return false;">×</button></div><div class="fields"><label class="field">期号<input id="period" inputmode="numeric"></label><label class="field">系统数据日期<input id="date" type="date"></label></div><div id="nums" class="nums"></div><div id="preview" class="preview">依次填写6个正码＋1个特码。保存后同步全部K线。</div><div class="actions"><button id="save" class="save" type="button">保存并同步全部</button><button id="deleteLast" class="danger" type="button">删除最近手工一期</button></div><div class="note">手工数据同步十二生肖、0–9尾、特码专区及全部技术指标；正式库出现同一期后自动去重。</div></section></div><script>(function(){'use strict';const STORE='macau_user_draws_v1';const BASE={period:243,label:'2026-243',date:'2026-08-31',count:974,nums:[42,17,12,46,9,24,21],zodiac:['牛','虎','羊','鸡','狗','羊','狗']};const map={1:'马',13:'马',25:'马',37:'马',49:'马',12:'羊',24:'羊',36:'羊',48:'羊',11:'猴',23:'猴',35:'猴',47:'猴',10:'鸡',22:'鸡',34:'鸡',46:'鸡',9:'狗',21:'狗',33:'狗',45:'狗',8:'猪',20:'猪',32:'猪',44:'猪',7:'鼠',19:'鼠',31:'鼠',43:'鼠',6:'牛',18:'牛',30:'牛',42:'牛',5:'虎',17:'虎',29:'虎',41:'虎',4:'兔',16:'兔',28:'兔',40:'兔',3:'龙',15:'龙',27:'龙',39:'龙',2:'蛇',14:'蛇',26:'蛇',38:'蛇'};const $=id=>document.getElementById(id),subtitle=$('subtitle'),balls=$('balls'),meta=$('meta'),app=$('app'),modal=$('backdrop'),period=$('period'),date=$('date'),preview=$('preview'),numsWrap=$('nums'),updateBtn=$('update'),closeBtn=$('close'),saveBtn=$('save'),deleteLastBtn=$('deleteLast');const labelForDate=iso=>{const y=Number(iso.slice(0,4)),t=Date.parse(iso+'T00:00:00Z');if(!Number.isFinite(t))return'';return iso.slice(0,4)+'-'+String(Math.floor((t-Date.UTC(y,0,1))/86400000)+1).padStart(3,'0')};const dateForPeriod=p=>new Date(Date.UTC(2026,0,p)).toISOString().slice(0,10);const getRaw=()=>{try{const x=JSON.parse(localStorage.getItem(STORE)||'[]');return Array.isArray(x)?x:[]}catch{return[]}},setLocal=x=>localStorage.setItem(STORE,JSON.stringify(x));function validLocal(r){const v=Array.isArray(r?.nums)?r.nums.map(Number):[];return r&&labelForDate(r.date)===String(r.label||'')&&v.length===7&&v.every(n=>Number.isInteger(n)&&n>=1&&n<=49)&&new Set(v).size===7}function getLocal(){const raw=getRaw(),cleaned=raw.filter(r=>Number(String(r.label||'').split('-').pop())>BASE.period&&validLocal(r)).sort((a,b)=>String(a.label).localeCompare(String(b.label)));if(JSON.stringify(raw)!==JSON.stringify(cleaned))setLocal(cleaned);return cleaned}const pad=n=>String(n).padStart(2,'0'),latest=()=>{const l=getLocal();return l.length?{...l[l.length-1],period:Number(l[l.length-1].label.split('-').pop()),count:BASE.count+l.length,local:true}:BASE};function renderTop(){const r=latest();subtitle.textContent=(r.local?'本机运行数据':'正式数据')+' · '+r.label;balls.innerHTML=r.nums.map((n,i)=>'<div class="ball '+(i===6?'special':'')+'"><strong>'+pad(n)+'</strong><span>'+r.zodiac[i]+'</span></div>').join('');meta.innerHTML='<span>数据日期 '+r.date+'</span><span>运行数据共'+r.count+'期</span><span class="badge '+(r.local?'local':'')+'">'+(r.local?'本机已同步K线':'正式数据')+'</span>'}function reloadApp(){app.src='./mobile-v704.html?v=runtime-'+Date.now()}const inputs=[];for(let i=0;i<7;i++){const lab=document.createElement('label');lab.textContent=i<6?'正码'+(i+1):'特码';const inp=document.createElement('input');inp.inputMode='numeric';inp.maxLength=2;lab.appendChild(inp);numsWrap.appendChild(lab);inputs.push(inp)}function fill(){const r=latest(),p=r.period+1;period.value=p;date.value=dateForPeriod(p);inputs.forEach(x=>x.value='');preview.className='preview';preview.textContent='依次填写6个正码＋1个特码。保存后同步全部K线。'}function validate(){const p=Number(period.value),vals=inputs.map(x=>Number(x.value)),r=latest(),errors=[],label='2026-'+String(p).padStart(3,'0');if(!Number.isInteger(p)||p!==r.period+1)errors.push('期号应为'+(r.period+1));if(!date.value||labelForDate(date.value)!==label)errors.push(label+' 对应系统日期应为 '+dateForPeriod(p));if(vals.some(n=>!Number.isInteger(n)||n<1||n>49))errors.push('号码必须是1–49整数');if(new Set(vals).size!==7)errors.push('7个号码不能重复');const z=vals.map(n=>map[n]);if(errors.length){preview.className='preview error';preview.textContent=errors.join('；');return null}preview.className='preview ok';preview.textContent='核验通过：'+vals.map((n,i)=>pad(n)+z[i]+(i===6?'（特码）':'')).join('、');return{label,date:date.value,nums:vals,zodiac:z}}period.addEventListener('input',()=>{const p=Number(period.value);if(Number.isInteger(p)&&p>=1&&p<=365)date.value=dateForPeriod(p)});inputs.forEach(x=>x.addEventListener('input',()=>{x.value=x.value.replace(/\D/g,'').slice(0,2);if(inputs.every(y=>y.value))validate()}));updateBtn.addEventListener('click',()=>{fill();modal.hidden=false});const forceClose=e=>{if(e){e.preventDefault();e.stopPropagation()}modal.hidden=true;modal.style.display='none';requestAnimationFrame(()=>{modal.style.removeProperty('display')})};closeBtn.addEventListener('click',forceClose,true);closeBtn.addEventListener('pointerup',forceClose,true);closeBtn.addEventListener('touchend',forceClose,{capture:true,passive:false});document.addEventListener('click',e=>{if(e.target&&e.target.closest&&e.target.closest('#close'))forceClose(e)},true);modal.addEventListener('click',e=>{if(e.target===modal)forceClose(e)});saveBtn.addEventListener('click',()=>{const row=validate();if(!row)return;const l=getLocal();l.push(row);setLocal(l);forceClose();renderTop();reloadApp()});deleteLastBtn.addEventListener('click',()=>{const l=getLocal();if(!l.length){preview.className='preview error';preview.textContent='没有可删除的本机手工数据。';return}l.pop();setLocal(l);renderTop();fill();reloadApp()});renderTop()})();</script></body></html>
