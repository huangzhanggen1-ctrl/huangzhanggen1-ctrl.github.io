<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071728">
<title>新澳门K线 · 第231期手机版</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071728}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#071728}
#status{position:fixed;inset:0;display:grid;place-items:center;background:#071728;color:#d9edff;font:600 15px system-ui;z-index:2}
</style>
</head>
<body>
<div id="status">正在打开第231期完整K线…</div>
<iframe id="app" title="新澳门生肖尾数K线第231期"></iframe>
<script>
(function(){
  const frame=document.getElementById('app');
  const status=document.getElementById('status');
  const params=new URLSearchParams(location.search);
  const view=params.get('view');
  frame.src='./?v=231-mobile-safe'+(view==='special'?'&view=special':'');
  frame.addEventListener('load',function(){
    try{
      const d=frame.contentDocument;
      if(!d)return;
      const style=d.createElement('style');
      style.id='mobile-safe-231';
      style.textContent=`
@media (max-width:760px){
  .chartFrame .tip,
  #macau-special-panel .smp-tip{
    top:6px!important;left:6px!important;max-width:calc(100% - 12px)!important;
    padding:5px 7px!important;gap:3px 6px!important;border-radius:7px!important;
    font-size:9px!important;line-height:1.28!important;box-shadow:0 4px 12px #0006!important;
  }
  .chartFrame .tip b,#macau-special-panel .smp-tip b{font-size:10px!important;line-height:1.25!important}
  .chartFrame .tip span,#macau-special-panel .smp-tip span{font-size:9px!important;line-height:1.25!important}
  .chartPanel,#macau-special-panel .smp-chart-panel{
    padding-bottom:calc(104px + env(safe-area-inset-bottom))!important;
  }
  .chartPointNav,#macau-special-panel .smp-point-nav{
    position:relative;z-index:4;margin-bottom:12px!important;
  }
  .chartBelowControls,#macau-special-panel .smp-chart-below-controls{
    scroll-margin-bottom:calc(110px + env(safe-area-inset-bottom));
  }
}
@media (max-width:390px){
  .chartFrame .tip,#macau-special-panel .smp-tip{font-size:8.5px!important;gap:2px 5px!important}
}`;
      (d.head||d.documentElement).appendChild(style);
      status.style.display='none';
    }catch(e){status.textContent='页面已载入；手机视觉修正未注入，请刷新一次。'}
  });
})();
</script>
</body>
</html>
